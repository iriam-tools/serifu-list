<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRIAMセリフ帳</title><meta name="description" content="6種類のセリフ集を、自分の言葉で編集・追加できるセリフ帳。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e425c'/%3E%3Cpath d='M8 8h16v12H14l-6 5z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"><script src="base.js" defer></script><script src="app.js" defer></script>
</head>
<body>
<header><div class="brand"><span class="mark" aria-hidden="true">「」</span><h1>IRIAMセリフ帳</h1></div><span class="personal">自分だけの編集スペース</span></header>
<main>
<section class="intro"><h2>IRIAMセリフ枠応援ツール、<br class="mobile">好きに編集してね٩( ᐛ )و</h2><p>原本から自由に編集・追加できます。変更はこのブラウザだけに保存されます。</p></section>
<div class="workspace">
<aside><p class="aside-label">セリフの種類</p><nav id="categories" aria-label="セリフの種類"></nav><div class="storage-note"><h3>あなたの編集は、あなたの手元に。</h3><p>原本や他の人のセリフ帳は変わりません。端末の変更やデータ消去に備えて、書き出して保管できます。</p></div><div class="backup"><button id="export">データを書き出す ↓</button><button id="import">データを読み込む ↑</button><input id="file" type="file" accept=".json,application/json" hidden></div></aside>
<section class="content" aria-labelledby="group-title"><div class="section-head"><div><div class="title-row"><h2 id="group-title"></h2><span id="count" class="count"></span></div><p id="prefix"></p></div><button id="add" class="primary">＋ セリフを追加</button></div>
<div class="tools"><label class="search"><span>検索</span><input id="search" type="search" placeholder="言葉や番号で探す" autocomplete="off"></label><p id="status" role="status" aria-live="polite">読み込み中</p></div>
<p id="error" role="alert" hidden></p><div id="list"></div><p id="empty" hidden>該当するセリフがありません。検索する言葉を変えてみてください。</p>
<div class="bottom"><span id="shown"></span><button id="reset" class="quiet">この種類を原本に戻す</button></div>
</section></div>
</main><footer>ログイン不要・編集内容はこのブラウザに保存されます</footer>
<dialog id="editor"><form id="edit-form"><div class="dialog-head"><h2 id="edit-title">セリフを編集</h2><button type="button" id="close" aria-label="閉じる">×</button></div><label for="text">セリフの本文</label><textarea id="text" rows="6" maxlength="10000" required></textarea><p class="hint">保存すると、あなたのセリフ帳だけに反映されます。</p><div class="dialog-actions"><button type="button" id="cancel">キャンセル</button><button class="primary" type="submit">保存する</button></div></form></dialog>
</body></html>
